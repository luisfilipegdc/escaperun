<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1016">
<title>Escape Run — Tablet bloqueado</title>
<style>
  :root {
    --bg: #0b1016;
    --panel: #121a23;
    --line: #25313f;
    --text: #e8eef5;
    --muted: #8a99ab;
    --accent: #3ddc97;
    --danger: #ff5d5d;
    --key: #1a2430;
    --key-active: #263444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 50% -10%, #1b2a3a 0%, transparent 70%),
      var(--bg);
    display: grid;
    place-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    user-select: none;
  }
  [hidden] { display: none !important; }

  /* ---------- tela de bloqueio ---------- */
  .lock {
    width: min(100%, 360px);
    text-align: center;
  }
  .icon {
    width: 56px; height: 56px;
    margin: 0 auto 14px;
    color: var(--muted);
    transition: color .3s;
  }
  .icon .shackle { transition: transform .45s cubic-bezier(.3,1.5,.5,1); transform-origin: 17px 11px; }
  .ok .icon { color: var(--accent); }
  .ok .icon .shackle { transform: rotate(-32deg) translateY(-1px); }

  .eyebrow {
    font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  h1 { font-size: 26px; font-weight: 650; margin: 0 0 22px; text-wrap: balance; }

  .slots {
    display: flex; justify-content: center; align-items: flex-end; gap: 10px;
    margin-bottom: 12px;
  }
  .slot {
    width: 54px; height: 66px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    font: 600 32px/66px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    transition: border-color .15s, color .15s;
  }
  .slot.cur { border-color: var(--muted); }
  .sep { font: 600 32px/1 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); padding-bottom: 10px; margin: 0 -4px; }
  .ok .slot { border-color: var(--accent); color: var(--accent); }
  .bad .slot { border-color: var(--danger); color: var(--danger); }
  .bad .slots { animation: shake .4s; }
  @keyframes shake {
    20% { transform: translateX(-9px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(4px); }
  }

  .msg { min-height: 22px; margin: 0 0 18px; font-size: 15px; color: var(--muted); }
  .bad .msg { color: var(--danger); }
  .ok .msg { color: var(--accent); }

  .keys {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    max-width: 300px; margin: 0 auto;
  }
  .keys button {
    appearance: none; border: 0; cursor: pointer;
    height: 64px; border-radius: 16px;
    background: var(--key); color: var(--text);
    font-family: inherit; font-size: 26px; font-weight: 500; line-height: 1;
    touch-action: manipulation;
    transition: background .1s, transform .1s;
  }
  .keys button:active { background: var(--key-active); transform: scale(.96); }
  .keys button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .keys .ghost { background: transparent; color: var(--muted); font-size: 15px; }
  .keys .ghost svg { width: 26px; height: 26px; vertical-align: middle; }
  .busy .keys { opacity: .5; pointer-events: none; }

  /* ---------- conteúdo revelado ---------- */
  .reveal {
    width: min(100%, 980px);
    text-align: center;
    animation: rise .5s ease-out both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  .reveal .eyebrow { color: var(--accent); margin-bottom: 14px; }
  .reveal img {
    display: block; width: 100%; height: auto;
    max-height: calc(100dvh - 150px); object-fit: contain;
    background: #fff; border-radius: 14px; padding: clamp(10px, 2.5vw, 24px);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .relock {
    appearance: none; margin-top: 18px; padding: 10px 18px;
    border: 1px solid var(--line); border-radius: 999px;
    background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  .relock:hover { color: var(--text); border-color: var(--muted); }

  @media (max-height: 620px) {
    .icon { width: 40px; height: 40px; margin-bottom: 8px; }
    h1 { font-size: 22px; margin-bottom: 14px; }
    .slot { height: 54px; line-height: 54px; font-size: 28px; }
    .keys button { height: 52px; }
    .msg { margin-bottom: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main class="lock" id="lock">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path class="shackle" d="M7 11V7.5a5 5 0 0 1 10 0V11"/>
    <rect x="4.5" y="11" width="15" height="10" rx="2.5"/>
    <circle cx="12" cy="16" r="1.3" fill="currentColor" stroke="none"/>
  </svg>
  <p class="eyebrow">Escape Run</p>
  <h1>Tablet bloqueado</h1>

  <div class="slots" id="slots" role="img" aria-label="Senha de 4 dígitos">
    <div class="slot"></div>
    <span class="sep">.</span>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite">Digite a senha para desbloquear</p>

  <div class="keys" id="keys">
    <button type="button" data-k="1">1</button>
    <button type="button" data-k="2">2</button>
    <button type="button" data-k="3">3</button>
    <button type="button" data-k="4">4</button>
    <button type="button" data-k="5">5</button>
    <button type="button" data-k="6">6</button>
    <button type="button" data-k="7">7</button>
    <button type="button" data-k="8">8</button>
    <button type="button" data-k="9">9</button>
    <button type="button" class="ghost" data-k="clear">Limpar</button>
    <button type="button" data-k="0">0</button>
    <button type="button" class="ghost" data-k="back" aria-label="Apagar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7 6-7z"/><path d="m12 9.5 5 5m0-5-5 5"/></svg>
    </button>
  </div>
</main>

<main class="reveal" id="reveal" hidden>
  <p class="eyebrow">Acesso liberado</p>
  <img id="photo" alt="Desafio: Você entende de proporção? Um cilindro, um cone e um tronco de cone com o mesmo raio R. O cilindro, de altura 2h, tem volume 48 L. Qual o volume do cone de altura 2h e do tronco de cone de altura h?">
  <button type="button" class="relock" id="relock">Bloquear novamente</button>
</main>

<script>
(() => {
  // A foto fica criptografada (AES-GCM) em assets/segredo.bin e só é aberta
  // com a senha correta — ela não aparece no código-fonte da página.
  // Para trocar a foto ou a senha: node tools/encrypt.mjs <imagem> <senha>
  const SECRET_URL = 'assets/segredo.bin';
  const ITERATIONS = 200000; // manter igual ao tools/encrypt.mjs
  const LENGTH = 4;

  const lock = document.getElementById('lock');
  const reveal = document.getElementById('reveal');
  const photo = document.getElementById('photo');
  const msg = document.getElementById('msg');
  const slots = [...document.querySelectorAll('.slot')];
  const DEFAULT_MSG = msg.textContent;

  let pin = '';
  let busy = false;
  let secret = null;

  const loadSecret = () => secret ??= fetch(SECRET_URL)
    .then(r => { if (!r.ok) throw new Error('rede'); return r.arrayBuffer(); })
    .catch(e => { secret = null; throw e; });
  loadSecret().catch(() => {});

  function render() {
    slots.forEach((s, i) => {
      s.textContent = pin[i] ?? '';
      s.classList.toggle('cur', i === pin.length);
    });
  }

  function setState(state, text) {
    lock.classList.remove('ok', 'bad');
    if (state) lock.classList.add(state);
    msg.textContent = text ?? DEFAULT_MSG;
  }

  async function decrypt(code) {
    const data = new Uint8Array(await loadSecret());
    const material = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: data.subarray(0, 16), iterations: ITERATIONS, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: data.subarray(16, 28) }, key, data.subarray(28));
  }

  async function submit() {
    busy = true;
    lock.classList.add('busy');
    setState(null, 'Verificando…');
    let plain = null, netError = false;
    try {
      plain = await decrypt(pin);
    } catch (e) {
      netError = e.name !== 'OperationError'; // OperationError = senha errada
    }
    lock.classList.remove('busy');

    if (plain) {
      setState('ok', 'Senha correta!');
      photo.src = URL.createObjectURL(new Blob([plain], { type: 'image/png' }));
      setTimeout(() => {
        lock.hidden = true;
        reveal.hidden = false;
        busy = false;
      }, 900);
      return;
    }

    setState('bad', netError ? 'Erro de conexão. Tente de novo.' : 'Senha incorreta');
    if (navigator.vibrate) navigator.vibrate(120);
    setTimeout(() => {
      pin = '';
      render();
      setState(null);
      busy = false;
    }, 1200);
  }

  function press(k) {
    if (busy) return;
    if (k === 'back') pin = pin.slice(0, -1);
    else if (k === 'clear') pin = '';
    else if (pin.length < LENGTH) pin += k;
    render();
    if (pin.length === LENGTH) submit();
  }

  document.getElementById('keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { press(b.dataset.k); b.blur(); }
  });

  document.addEventListener('keydown', e => {
    if (!reveal.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('back');
    else if (e.key === 'Escape' || e.key === 'Delete') press('clear');
  });

  document.getElementById('relock').addEventListener('click', () => {
    URL.revokeObjectURL(photo.src);
    photo.removeAttribute('src');
    pin = '';
    render();
    setState(null);
    reveal.hidden = true;
    lock.hidden = false;
  });

  render();
})();
</script>
</body>
</html>
